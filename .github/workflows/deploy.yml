name: Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Apply Kubernetes manifest
        run: kubectl apply -f workflow/localtest/Untiled.yaml
        env:
          KUBECONFIG: /home/ubuntu/.kube/config
